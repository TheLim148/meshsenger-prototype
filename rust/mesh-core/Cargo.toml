[package]
name = "mesh-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
uniffi = { version = "0.31.1", features = ["cli"] }
uuid = { version = "1", features = ["v4", "serde"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"